<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="C1: a wall grows half its thickness to each side of its start-to-end centre line">
  <title>C1: a wall's thickness</title>
  <rect width="520" height="240" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
  <rect x="60" y="100" width="340" height="50" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/>
  <line x1="60" y1="125" x2="400" y2="125" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8 5"/>
  <circle cx="60" cy="125" r="4.5" fill="#c0392b"/>
  <circle cx="400" cy="125" r="4.5" fill="#c0392b"/>
  <text x="60" y="88" text-anchor="middle">start</text>
  <text x="400" y="88" text-anchor="middle">end</text>
  <text x="230" y="120" text-anchor="middle" fill="#c0392b">centre line: start → end</text>
  <line x1="420" y1="100" x2="420" y2="125" stroke="#222" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="420" y1="125" x2="420" y2="150" stroke="#222" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="403" y1="100" x2="428" y2="100" stroke="#888" stroke-width="0.8"/>
  <line x1="403" y1="150" x2="428" y2="150" stroke="#888" stroke-width="0.8"/>
  <text x="428" y="117">thickness / 2</text>
  <text x="428" y="145">thickness / 2</text>
  <text x="60" y="190">"start": [0, 0], "end": [3.4, 0], "thickness": 0.5</text>
</svg>
