<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="C2: an opening's offset runs along the wall from its start to the opening's near edge">
  <title>C2: where an opening sits</title>
  <rect width="520" height="240" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
  <rect x="40" y="110" width="160" height="24" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/>
  <rect x="300" y="110" width="180" height="24" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/>
  <line x1="200" y1="110" x2="200" y2="134" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="110" x2="300" y2="134" stroke="#222" stroke-width="1.5"/>
  <path d="M200 134 L200 234" stroke="none"/>
  <path d="M200 134 A100 100 0 0 0 300 234" fill="none" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="200" y1="134" x2="200" y2="234" stroke="#222" stroke-width="2"/>
  <circle cx="40" cy="122" r="4.5" fill="#c0392b"/>
  <text x="40" y="100" text-anchor="middle">start</text>
  <text x="480" y="100" text-anchor="middle">end</text>
  <line x1="40" y1="70" x2="200" y2="70" stroke="#222" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="120" y="62" text-anchor="middle">offset</text>
  <line x1="200" y1="70" x2="300" y2="70" stroke="#222" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="250" y="62" text-anchor="middle">width</text>
  <line x1="40" y1="34" x2="480" y2="34" stroke="#888" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="260" y="26" text-anchor="middle" fill="#555">the wall's length, along its centre line</text>
  <line x1="40" y1="40" x2="40" y2="110" stroke="#888" stroke-width="0.8"/>
  <line x1="200" y1="76" x2="200" y2="110" stroke="#888" stroke-width="0.8"/>
  <line x1="300" y1="76" x2="300" y2="110" stroke="#888" stroke-width="0.8"/>
  <line x1="480" y1="40" x2="480" y2="110" stroke="#888" stroke-width="0.8"/>
  <text x="318" y="170">0 ≤ offset</text>
  <text x="318" y="190">offset + width ≤ length</text>
  <text x="318" y="214" fill="#555">"hinge": "start", "swing": "right"</text>
</svg>
